name: Refresh UFL friendly matches
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: ufl-friendly-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Refresh public EA friendlies without rebuilding the website
        shell: bash
        run: |
          cp bot-feed/refresh.mjs "$RUNNER_TEMP/ufl-friendly-refresh.mjs"
          cp bot-feed/clubs.json "$RUNNER_TEMP/ufl-friendly-clubs.json"
          git fetch origin codex/bot-friendly-feed --depth=1
          git switch --create codex/bot-friendly-feed --track origin/codex/bot-friendly-feed
          FRIENDLY_CONFIG="$RUNNER_TEMP/ufl-friendly-clubs.json" node "$RUNNER_TEMP/ufl-friendly-refresh.mjs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot-feed/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public UFL friendly matches'
          git push origin HEAD:codex/bot-friendly-feed

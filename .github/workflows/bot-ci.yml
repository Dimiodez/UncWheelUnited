name: Verify UFL bot
on:
  push:
    branches: [main]
    paths: ['ufb-bot/**', '.github/workflows/bot-ci.yml']
  pull_request:
    paths: ['ufb-bot/**', '.github/workflows/bot-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ufb-bot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir runtime install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: node --test tests/interaction-ack.test.mjs
      - run: pnpm run test:unit
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ufl-bot-${{ github.sha }}
          path: ufb-bot/dist/
